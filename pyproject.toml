[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kanmaxent"
version = "0.1.0"
description = "Auditable additive B-spline + discrete IPP for presence-only SDM (Deep residual probe optional)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
deep = ["pykan==0.2.8"]

[tool.setuptools.packages.find]
include = ["kanmaxent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
